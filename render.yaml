services:
  # 1. Backend NestJS REST API Service
  - type: web
    name: threads-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build && npm run prisma:seed
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: threads-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@threadandco.com
      - key: ADMIN_PASSWORD
        value: AdminPassword123!

  # 2. Frontend React Vite Static Site
  - type: static_site
    name: threads-ui
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://threads-api.onrender.com/api

databases:
  # 3. PostgreSQL Managed Database
  - name: threads-db
    plan: free
    databaseName: threads_db
    user: threads_user
