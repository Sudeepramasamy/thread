<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9BE9B"/>
      <stop offset="50%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9E8159"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#0D0D10"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Atelier Needle & Thread Motif -->
  <!-- Subtle Thread Loop Curve -->
  <path d="M 20 44 C 20 50, 44 50, 44 42 C 44 34, 20 38, 20 22 C 20 14, 38 12, 44 18" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="1.5" 
        stroke-linecap="round"
        stroke-dasharray="2 3"
        opacity="0.4"/>

  <!-- Serif Monogram "T" -->
  <!-- Top Horizontal Bar with Serifs -->
  <path d="M 18 20 L 46 20 M 18 18 L 18 23 M 46 18 L 46 23" 
        stroke="url(#goldGradient)" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <!-- Vertical Stem with Base Serif -->
  <path d="M 32 20 L 32 46 M 25 46 L 39 46" 
        stroke="url(#goldGradient)" 
        stroke-width="3.5" 
        stroke-linecap="round"/>

  <!-- Small diamond accent in center bottom -->
  <polygon points="32,49 34,51 32,53 30,51" fill="#C5A880" />
</svg>
